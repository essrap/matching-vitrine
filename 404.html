<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — Mreguel</title>
  <!-- Une page d'erreur n'a rien à faire dans un index : sans ce noindex, une
       404 servie en 200 par erreur (redirection mal posée, lien mort partagé)
       finirait indexée à la place du contenu. -->
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0f5a74" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="/">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 17V7l5.5 6L14 7v10" stroke-width="2.2"></path>
        <path d="m10 13.5 3.5 3.5L21.5 5.5" stroke="var(--safran)" stroke-width="2.6"></path>
      </svg>
      Mreguel
    </a>
    <a class="lang" href="/ar/" lang="ar" hreflang="ar" dir="rtl">العربية</a>
    <a class="btn btn-primary" href="/">Retour à l'accueil</a>
  </div>
</header>

<main>
  <section class="band">
    <div class="wrap section-head">
      <p class="eyebrow">Erreur 404</p>
      <h1>Cette page n'existe pas</h1>
      <p>Le lien est peut-être ancien, ou l'adresse comporte une faute. Le reste du site, lui, est toujours là.</p>
      <div class="cta-row">
        <a class="btn btn-primary btn-lg" href="/">Voir la page d'accueil</a>
        <a class="btn btn-ghost btn-lg" href="https://app.mreguel.com">Ouvrir l'application</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="legal">
      <p>Mreguel Service — Cité SNIT, Hergla 4012, Tunisie — <a href="mailto:mreguel@gmail.com">mreguel@gmail.com</a></p>
    </div>
  </div>
</footer>
</body>
</html>
